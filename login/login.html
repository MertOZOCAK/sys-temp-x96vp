<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mertix Network • Yakında!</title>
    <link rel="shortcut icon" href="../res/logo.png" type="image/x-icon">  
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
    <div class="bg">
        <div class="blob"></div>
    </div>

    <main class="container">
        <div class="logo">
            <h1 style="color: #f1c40f; font-weight: 900; letter-spacing: 2px;">MERTİX NETWORK</h1>
        </div>

        <section class="content">
            <h2 data-key="title" class="title">BÜYÜK AÇILIŞA HAZIRLANIYORUZ</h2>
            <p data-key="subtitle" class="subtitle">Çok yakında buradayız!</p>
        </section>

        <section class="countdown">
            <div class="time-block">
                <span class="time-value" id="days">00</span>
                <span data-key="days" class="time-label">GÜN</span>
            </div>
            <span class="separator">:</span>
            <div class="time-block">
                <span class="time-value" id="hours">00</span>
                <span data-key="hours" class="time-label">SAAT</span>
            </div>
            <span class="separator">:</span>
            <div class="time-block">
                <span class="time-value" id="minutes">00</span>
                <span data-key="minutes" class="time-label">DAKİKA</span>
            </div>
            <span class="separator">:</span>
            <div class="time-block">
                <span class="time-value" id="seconds">00</span>
                <span data-key="seconds" class="time-label">SANİYE</span>
            </div>
        </section>

        <form class="email-form" id="email-form">
    <div class="input-wrapper">
        <input data-key="email" type="email" required placeholder="E-posta adresini bırak..." />
        <button type="submit" class="side-btn" title="Haber Ver">
            <i class="fa-solid fa-bell"></i>
        </button>
    </div>
</form>

        <div class="success-message hidden" id="success">
            <i class="fa-solid fa-check-circle"></i>
            <span data-key="success">Kaydın başarıyla oluşturuldu. Sunucumuz aktif olduğunda e-posta adresine bir davetiye göndereceğiz.</span>
        </div>
    </main>
    <script src="js/script.js" defer></script>
    <script src="js/language.js" defer></script>
</body>
</html>
