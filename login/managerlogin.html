<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mertix Network • Yönetici Girişi</title>
    <link rel="shortcut icon" href="../res/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="css/mlstyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>

<body>
    <div class="bg-glow"></div>

    <div class="login-card">
        <div class="logo-area">
            <h1>MERTİX PANEL</h1>
            <p>Sistem Yönetim Girişi</p>
        </div>

        <div id="error-msg" style="color: #e74c3c; font-size: 0.85rem; margin-bottom: 15px; display: none;">
            Hatalı kullanıcı adı veya şifre!
        </div>

        <form id="adminLoginForm">
            <div class="input-group">
                <label>Yönetici Kimliği</label>
                <div class="input-field">
                    <i class="fa-solid fa-id-badge"></i>
                    <input type="text" id="adminId" placeholder="Yönetici ID" required>
                </div>
            </div>

            <div class="input-group">
                <label>Güvenlik Anahtarı</label>
                <div class="input-field">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="adminPass" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="login-btn">SİSTEME GİRİŞ YAP</button>
        </form>

        <a href="login.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Dön</a>
    </div>

    <script type="module" src="js/mlscript.js"></script>
</body>

</html>
